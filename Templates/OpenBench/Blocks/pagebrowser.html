{% load mytags %}{% if paging.prev != paging.next %}<nav class="pagination" aria-label="Pagination">
  <a class="page previous{% if paging.page == 1 %} is-off{% endif %}"{% if paging.page == 1 %} aria-disabled="true" tabindex="-1"{% endif %} aria-label="Previous page" href="/{{ paging.url }}/{{ paging.prev }}/">{% icon "back" %}</a>
  <div class="pages">{% for page in paging.pages %}{% if page == "..." %}<span class="page ellipsis" aria-hidden="true">…</span>{% elif page == paging.page %}<a class="page current" aria-current="page" href="/{{ paging.url }}/{{ page }}/">{{ page }}</a>{% else %}<a class="page" href="/{{ paging.url }}/{{ page }}/">{{ page }}</a>{% endif %}{% endfor %}</div>
  <a class="page next{% if paging.next == paging.page %} is-off{% endif %}"{% if paging.next == paging.page %} aria-disabled="true" tabindex="-1"{% endif %} aria-label="Next page" href="/{{ paging.url }}/{{ paging.next }}/">{% icon "chev" %}</a>
</nav>{% endif %}
