{% extends "OpenBench/base.html" %}

{% block content %}

    <form class="auth-form" method="POST" action="/login/">
        {% csrf_token %}
        <div class="form">
            <div class="col">
                <div class="row">
                    <label for="username">Username</label><input id="username" type="text" name="username" autocomplete="username" required><br>
                </div>
                <div class="row">
                    <label for="password">Password</label><input id="password" type="password" name="password" autocomplete="current-password" required><br>
                </div>
                <input type="submit" name="submit" value="Login" class="anchorbutton btn-blue w-100">
            </div>
        </div>
    </form>

{% endblock %}
