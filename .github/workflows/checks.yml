name: Checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            Client/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r Client/requirements.txt

      - name: Django checks and migrations
        id: django
        run: |
          python manage.py check
          python manage.py migrate --noinput
          python manage.py makemigrations --check --dry-run

      - name: Compile Python sources
        id: compile
        run: python -m compileall -q Client OpenBench OpenSite Scripts manage.py

      - name: Queue ETA tests
        id: eta
        run: python manage.py test OpenBench.tests.test_eta

      - name: Summary
        if: always()
        env:
          DJANGO_RESULT: ${{ steps.django.outcome }}
          COMPILE_RESULT: ${{ steps.compile.outcome }}
          ETA_RESULT: ${{ steps.eta.outcome }}
        run: |
          {
            printf '| Check | Result |\n| --- | --- |\n'
            printf '| Django and migrations | %s |\n' "$DJANGO_RESULT"
            printf '| Python compilation | %s |\n' "$COMPILE_RESULT"
            printf '| Queue ETA tests | %s |\n' "$ETA_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
